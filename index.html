<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 24px 40px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><path d="M48 0H0V48" fill="none" stroke="%23161620" stroke-width="1"/></svg>');
    background-repeat: repeat;
  }
  /* Rekonise-style 2-Column Split Container */
  .auth-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 36px;
    align-items: start;
  }
  @media (max-width: 768px) {
    .auth-card {
      grid-template-columns: 1fr;
      gap: 24px;
      padding: 20px;
    }
  }
  .script-thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    background-color: var(--panel-raised);
    background-size: cover;
    background-position: center;
    border-radius: 12px;
    border: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .task-action-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #FF0000;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(255, 0, 0, 0.3);
  }
  .task-action-btn:hover {
    background: #e00000;
    transform: translateY(-1px);
  }
  .task-action-btn.completed {
    background: var(--panel-raised);
    color: #34d399;
    border: 1px solid var(--line);
    box-shadow: none;
    cursor: default;
  }
  .progress-container {
    margin-bottom: 18px;
  }
  .progress-bar-bg {
    position: relative;
    width: 100%;
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    width: 0%;
    height: 100%;
    background: #34d399;
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  /* Left-right loading sweep, shown while we wait for the visitor to finish on YouTube */
  .progress-bar-sweep {
    position: absolute;
    top: 0;
    left: 0;
    width: 34%;
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .progress-bar-bg.loading .progress-bar-sweep {
    opacity: 1;
    animation: sweepLR 1s ease-in-out infinite alternate;
  }
  @keyframes sweepLR {
    from { transform: translateX(0); }
    to   { transform: translateX(194%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .progress-bar-bg.loading .progress-bar-sweep { animation: none; width: 100%; opacity: 0.45; }
  }
  .step-list { display: flex; gap: 6px; margin-bottom: 14px; }
  .step-pill {
    flex: 1;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 7px 4px;
    border-radius: 8px;
    border: 1px solid var(--line);
    color: var(--muted);
    background: var(--panel-raised);
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .step-pill.active { color: var(--text); border-color: var(--accent); }
  .step-pill.done { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }
  .task-action-btn.pending {
    background: var(--panel-raised);
    color: var(--text);
    border: 1px solid var(--line);
    box-shadow: none;
  }
  .task-action-btn.pending:hover { background: var(--panel-raised); transform: none; }
  .task-hint {
    min-height: 34px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--muted);
    text-align: center;
    margin: -4px 0 12px;
  }
  .script-thumb { position: relative; overflow: hidden; }
  .video-embed { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .watch-btn {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 14px;
    padding: 11px 14px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .watch-btn.show { display: flex; }
  .watch-btn:hover { background: var(--panel-raised); border-color: var(--accent); }
  .unlock-action-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: not-allowed;
    opacity: 0.7;
    transition: all 0.2s ease;
  }
  .unlock-action-btn.unlocked {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    cursor: pointer;
    opacity: 1;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .unlock-action-btn.unlocked:hover {
    background: var(--accent-hover);
  }
  .auth-timer-box {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    margin-bottom: 14px;
    display: none;
  }
  @media (max-width: 760px){ body{ padding-bottom: 0; } }
</style>

<main>

<script>
  const SUPABASE_URL = 'https://simvzhlzpakjpxdjabgp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpbXZ6aGx6cGFranB4ZGphYmdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDU1NTksImV4cCI6MjEwMzU4MTU1OX0.kT56fV8kWdEhC9X4WJkGOGjK5L7mJ0vB0NS-pO45BIY';

  const urlParams = new URLSearchParams(window.location.search);
  const scriptId = urlParams.get('id');

  let scriptData = null;
  let timerStarted = false;

  // Fetch public script details from Supabase on load (secret columns are hidden from the anon key)
  async function fetchScriptInfo() {
      if (!scriptId) {
          document.querySelector('.auth-card').innerHTML = `<p style="color:#f87171; font-family:var(--font-mono); text-align:center;">Error: Missing script ID parameter in URL.</p>`;
          return;
      }

      try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/scripts?id=eq.${encodeURIComponent(scriptId)}&select=name,description,thumbnail,video_url`, {
              headers: {
                  'apikey': SUPABASE_ANON_KEY,
                  'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
              }
          });
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
              scriptData = data[0];
              setupVideo();
              document.getElementById('script-title').textContent = scriptData.name;
              document.getElementById('script-desc').textContent = scriptData.description || 'Complete the quick steps to access your secure download link.';
              
              // Only accept https image URLs, and let the browser normalise the URL before it goes into CSS
              if (typeof scriptData.thumbnail === 'string' && scriptData.thumbnail.startsWith('https://')) {
                  try {
                      document.getElementById('script-thumb').style.backgroundImage = `url("${new URL(scriptData.thumbnail).href}")`;
                  } catch (e) {}
              }
          } else {
              throw new Error('Script not found.');
          }
      } catch (err) {
          document.getElementById('error-msg').textContent = 'Could not load script configuration.';
          document.getElementById('error-msg').style.display = 'block';
      }
  }

  fetchScriptInfo();

  // ---------- Steps: Subscribe -> Like -> Comment ----------
  // Each step opens YouTube. The step completes once the visitor has been away from this
  // tab/window for AWAY_MS. (This is a "dwell" check: we cannot see what they do on YouTube.)
  const AWAY_MS = 5000;
  const CHANNEL_URL = 'https://www.youtube.com/@SurfaceScripts';
  const $ = (id) => document.getElementById(id);

  function videoUrl() {
      const v = scriptData && scriptData.video_url;
      return (typeof v === 'string' && v.startsWith('https://')) ? v : CHANNEL_URL;
  }

  const STEPS = [
      { label: 'Subscribe to channel', done: 'Subscribed ✓', url: () => CHANNEL_URL + '?sub_confirmation=1' },
      { label: 'Like the video',       done: 'Liked ✓',      url: videoUrl },
      { label: 'Comment on the video', done: 'Commented ✓',  url: videoUrl },
  ];

  let stepIndex = 0;        // step currently shown
  let completedCount = 0;   // finished steps
  let phase = 'idle';       // idle | waiting | done | finished
  let awaySince = null;     // when the visitor left this tab
  let awayTick = null;      // interval driving the little countdown
  let windowBlurred = false;

  function setHint(text) { $('task-hint').textContent = text; }
  function setLoading(on) { $('progress-bar').classList.toggle('loading', on); }
  function stopAwayTick() { if (awayTick) { clearInterval(awayTick); awayTick = null; } }

  function renderProgress() {
      $('progress-text').textContent = `${completedCount}/${STEPS.length} done`;
      $('progress-fill').style.width = (completedCount / STEPS.length * 100) + '%';
      $('step-indicator').textContent = completedCount >= STEPS.length
          ? 'Completed' : `Step ${completedCount + 1} of ${STEPS.length}`;
      document.querySelectorAll('.step-pill').forEach((el, i) => {
          el.classList.toggle('done', i < completedCount);
          el.classList.toggle('active', i === completedCount);
      });
  }

  function showStep(i) {
      stepIndex = i;
      phase = 'idle';
      awaySince = null;
      stopAwayTick();
      setLoading(false);
      const btn = $('task-btn');
      btn.className = 'task-action-btn';
      btn.disabled = false;
      $('task-btn-text').textContent = STEPS[i].label;
      setHint('Press the button to open YouTube, and complete task.');
      renderProgress();
  }

  // Button handler (also used to re-open YouTube if the visitor came back too early)
  function handleTaskAction() {
      if (phase !== 'idle' && phase !== 'waiting') return;
      phase = 'waiting';           // set BEFORE opening, so the tab-hidden event is not missed
      awaySince = null;
      stopAwayTick();

      const w = window.open(STEPS[stepIndex].url(), '_blank');
      if (!w) {
          phase = 'idle';
          setLoading(false);
          $('task-btn').className = 'task-action-btn';
          $('task-btn-text').textContent = STEPS[stepIndex].label;
          setHint('Your browser blocked the new tab. Allow pop-ups for this site and press the button again.');
          return;
      }
      try { w.opener = null; } catch (e) {}

      $('task-btn').className = 'task-action-btn pending';
      $('task-btn-text').textContent = 'Waiting for YouTube… (tap to reopen)';
      setLoading(true);
      setHint('Do it on YouTube and stay there for 5 seconds, then come back.');
      setTimeout(syncAway, 400);   // catch the case where the tab was already hidden
  }

  function isAway() { return document.visibilityState === 'hidden' || windowBlurred; }

  function syncAway() {
      if (phase !== 'waiting') return;
      const away = isAway();
      if (away && awaySince === null) {
          awaySince = Date.now();
          stopAwayTick();
          awayTick = setInterval(tickAway, 250);
          tickAway();
      } else if (!away && awaySince !== null) {
          // Back on this page: check the real elapsed time (timers may have been frozen while away)
          const elapsed = Date.now() - awaySince;
          awaySince = null;
          stopAwayTick();
          if (elapsed >= AWAY_MS) {
              completeStep();
          } else {
              setHint(`Stay on YouTube, then come back. (Tap the button to reopen it)`);
          }
      }
  }

  function tickAway() {
      if (phase !== 'waiting' || awaySince === null) return;
      const left = Math.ceil((AWAY_MS - (Date.now() - awaySince)) / 1000);
      if (left <= 0) { completeStep(); return; }
      setHint(`Stay on YouTube… ${left}s`);
  }

  function completeStep() {
      if (phase !== 'waiting') return;
      phase = 'done';
      awaySince = null;
      stopAwayTick();
      setLoading(false);
      completedCount++;

      const btn = $('task-btn');
      btn.className = 'task-action-btn completed';
      btn.disabled = true;
      $('task-btn-text').textContent = STEPS[stepIndex].done;
      setHint('');
      renderProgress();

      if (completedCount < STEPS.length) {
          setTimeout(() => showStep(completedCount), 900);
      } else {
          phase = 'finished';
          $('task-btn-text').textContent = 'All steps completed ✓';
          if (!timerStarted) startHiddenTimer();   // existing 10 s security timer, then Unlock
      }
  }

  document.addEventListener('visibilitychange', syncAway);
  window.addEventListener('blur', () => {
      // Clicking into the embedded video also blurs the window; that is not "leaving".
      setTimeout(() => {
          if (document.activeElement && document.activeElement.tagName === 'IFRAME') return;
          windowBlurred = true;
          syncAway();
      }, 0);
  });
  window.addEventListener('focus', () => { windowBlurred = false; syncAway(); });
  window.addEventListener('pageshow', () => { windowBlurred = false; syncAway(); });

  // ---------- Optional: watch the video embedded on this page ----------
  let videoId = null;
  let watching = false;

  function ytId(u) {
      try {
          const x = new URL(u);
          const h = x.hostname.replace(/^(www|m)\./, '');
          let id = null;
          if (h === 'youtu.be') {
              id = x.pathname.slice(1).split('/')[0];
          } else if (h === 'youtube.com' || h === 'music.youtube.com') {
              if (x.pathname === '/watch') id = x.searchParams.get('v');
              else {
                  const m = x.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?]+)/);
                  if (m) id = m[1];
              }
          }
          return (id && /^[A-Za-z0-9_-]{11}$/.test(id)) ? id : null;
      } catch (e) { return null; }
  }

  function setupVideo() {
      videoId = ytId(scriptData && scriptData.video_url);
      if (videoId) $('watch-btn').classList.add('show');
  }

  function toggleVideo() {
      if (!videoId) return;
      const thumb = $('script-thumb');
      if (!watching) {
          const f = document.createElement('iframe');
          f.className = 'video-embed';
          f.title = 'Video player';
          f.src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0`;
          f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          f.allowFullscreen = true;
          f.referrerPolicy = 'strict-origin-when-cross-origin';
          thumb.appendChild(f);
          watching = true;
          $('watch-btn-text').textContent = 'Hide video';
      } else {
          const f = thumb.querySelector('iframe');
          if (f) f.remove();
          watching = false;
          $('watch-btn-text').textContent = 'Watch the video';
      }
  }

  // 10-Second Hidden Timer Function
  function startHiddenTimer() {
      timerStarted = true;
      const timerBox = document.getElementById('timer-box');
      const countdownEl = document.getElementById('countdown');
      timerBox.style.display = 'block';

      let timeLeft = 10;
      const timerInterval = setInterval(() => {
          timeLeft--;
          countdownEl.textContent = timeLeft;
          if (timeLeft <= 0) {
              clearInterval(timerInterval);
              timerBox.style.display = 'none';
              
              // Unlock final button
              const unlockBtn = document.getElementById('unlock-btn');
              unlockBtn.disabled = false;
              unlockBtn.className = 'unlock-action-btn unlocked';
              document.getElementById('unlock-btn-text').textContent = 'Unlock link';
          }
      }, 1000);
  }

  // Ask the Cloudflare Worker for a session + Work.ink link, then redirect
  async function getShortlink() {
      const unlockBtn = document.getElementById('unlock-btn');
      const errorMsg = document.getElementById('error-msg');
      document.getElementById('unlock-btn-text').textContent = 'Generating Session...';
      unlockBtn.disabled = true;

      try {
          if (!scriptData) {
              throw new Error('Script not loaded yet. Please refresh the page.');
          }

          // The Worker looks up the link itself (nothing sensitive is sent from the browser)
          const workerUrl = `https://auth.enwar-d.workers.dev/api/create-session?script_id=${encodeURIComponent(scriptId)}`;
          
          const response = await fetch(workerUrl);
          const data = await response.json();

          if (!response.ok) {
              throw new Error(data.error || 'Failed to generate session.');
          }

          if (data.shortlink && data.session) {
              // Remember the session so unlock.html can finish the job after Work.ink
              try { localStorage.setItem('surface_session', data.session); } catch (e) {}
              window.location.href = data.shortlink;
          } else {
              throw new Error('Invalid server response.');
          }
      } catch (err) {
          errorMsg.textContent = err.message;
          errorMsg.style.display = 'block';
          document.getElementById('unlock-btn-text').textContent = 'Unlock link';
          unlockBtn.disabled = false;
      }
  }
  showStep(0);
</script>
