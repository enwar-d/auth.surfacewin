<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 24px 40px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><path d="M48 0H0V48" fill="none" stroke="%23161620" stroke-width="1"/></svg>');
    background-repeat: repeat;
  }
  /* Rekonise-style 2-Column Split Container */
  .auth-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 36px;
    align-items: start;
  }
  @media (max-width: 768px) {
    .auth-card {
      grid-template-columns: 1fr;
      gap: 24px;
      padding: 20px;
    }
  }
  .script-thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    background-color: var(--panel-raised);
    background-size: cover;
    background-position: center;
    border-radius: 12px;
    border: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .task-action-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #FF0000;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(255, 0, 0, 0.3);
  }
  .task-action-btn:hover {
    background: #e00000;
    transform: translateY(-1px);
  }
  .task-action-btn.completed {
    background: var(--panel-raised);
    color: #34d399;
    border: 1px solid var(--line);
    box-shadow: none;
    cursor: default;
  }
  .progress-container {
    margin-bottom: 18px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-bar-fill {
    width: 0%;
    height: 100%;
    background: #34d399;
    transition: width 0.3s ease;
  }
  .unlock-action-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    cursor: not-allowed;
    opacity: 0.7;
    transition: all 0.2s ease;
  }
  .unlock-action-btn.unlocked {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    cursor: pointer;
    opacity: 1;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .unlock-action-btn.unlocked:hover {
    background: var(--accent-hover);
  }
  .auth-timer-box {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    margin-bottom: 14px;
    display: none;
  }
  @media (max-width: 760px){ body{ padding-bottom: 0; } }
</style>

<main>
  <div class="auth-wrap">
    <div class="auth-card" style="grid-template-columns:1fr; max-width:640px;">
      <div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span id="badge" style="font-family:var(--font-mono); font-size:11.5px; color:var(--muted);">Checking session...</span>
          <span style="font-family:var(--font-mono); font-size:11.5px; color:#34d399; font-weight:600;">3/3 done</span>
        </div>
        <h1 id="title" style="font-family:var(--font-display); font-size:22px; font-weight:700; margin:0 0 6px; letter-spacing:-0.01em;">Unlocking...</h1>
        <p id="hint" style="color:var(--muted); font-size:13px; margin:0 0 14px; line-height:1.5;">Please wait a moment.</p>
        <textarea id="code" readonly style="display:none; width:100%; height:260px; background:var(--panel-raised); border:1px solid var(--line); border-radius:12px; padding:14px; font-family:var(--font-mono); font-size:12px; color:#34d399; resize:none; outline:none; box-sizing:border-box;"></textarea>
        <button id="copy-btn" onclick="copyScript()" class="unlock-action-btn unlocked" style="display:none; margin-top:14px;">
          <span id="copy-text">Copy script</span>
        </button>
        <p id="error-msg" style="color:#f87171; font-family:var(--font-mono); font-size:12px; text-align:center; margin-top:12px; display:none;"></p>
        <button id="retry-btn" onclick="claim()" class="unlock-action-btn unlocked" style="display:none; margin-top:14px;">
          <span>Try again</span>
        </button>
      </div>
    </div>
  </div>
</main>

<script>
  // Your Cloudflare Worker (no trailing slash)
  const WORKER_URL = 'https://auth.enwar-d.workers.dev';

  // Work.ink sends the user here as  unlock.html?token=...   (the session id was saved by auth.html)
  const wiToken = new URLSearchParams(window.location.search).get('token');
  let session = null;
  try { session = localStorage.getItem('surface_session'); } catch (e) {}
  // Remove the token from the address bar right away (also stops it being shared/bookmarked)
  history.replaceState(null, '', window.location.pathname);

  // canRetry = temporary problem on our side or Work.ink's side; nothing was used up, so offer a retry
  function fail(msg, canRetry) {
    document.getElementById('badge').textContent = 'Not unlocked';
    document.getElementById('title').textContent = 'Could not unlock';
    document.getElementById('hint').textContent = canRetry
      ? 'This looks temporary. Press "Try again" in a few seconds.'
      : 'Go back to the script page and complete the steps again.';
    const e = document.getElementById('error-msg');
    e.textContent = msg; e.style.display = 'block';
    document.getElementById('retry-btn').style.display = canRetry ? 'flex' : 'none';
  }

  async function claim() {
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('retry-btn').style.display = 'none';
    document.getElementById('badge').textContent = 'Checking session...';
    document.getElementById('title').textContent = 'Unlocking...';
    document.getElementById('hint').textContent = 'Please wait a moment.';
    if (!wiToken) return fail('No token found, or has been bypassed. This page only works once, right after completing the link.');
    if (!session) return fail('No session found. Open the script page and finish the link in the same browser.');
    try {
      const res = await fetch(`${WORKER_URL}/api/claim?session=${encodeURIComponent(session)}&token=${encodeURIComponent(wiToken)}`);
      const data = await res.json().catch(() => ({}));
      // Server-side/temporary errors (5xx): the Worker handed the session back, so keep it and let them retry.
      if (res.status >= 500) return fail(data.error || 'Server error.', true);
      // Anything else is final: the session is single-use, so forget it
      try { localStorage.removeItem('surface_session'); } catch (e) {}
      if (!res.ok) return fail(data.error || 'Verification failed.');
      document.getElementById('badge').textContent = 'Script unlocked';
      document.getElementById('title').textContent = data.name || 'Your script';
      document.getElementById('hint').textContent = 'Copy your script now! This page only works once, so refreshing will lock it again.';
      const box = document.getElementById('code');
      box.value = data.code || '';
      box.style.display = 'block';
      document.getElementById('copy-btn').style.display = 'flex';
    } catch (err) {
      fail('Network error. Please try again.', true);
    }
  }

  async function copyScript() {
    const box = document.getElementById('code');
    try { await navigator.clipboard.writeText(box.value); }
    catch { box.select(); document.execCommand('copy'); }
    document.getElementById('copy-text').textContent = 'Copied ✓';
    setTimeout(() => (document.getElementById('copy-text').textContent = 'Copy script'), 2000);
  }

  claim();
</script>
